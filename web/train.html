<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Train — ShtetlFrames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,560&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="wrap">
    <nav id="siteNav"></nav>

    <div class="tabs" role="tablist">
      <button type="button" data-tab="clips" class="active">Label clips</button>
      <button type="button" data-tab="frames">Frames</button>
    </div>

    <div class="tab-pane" data-tab="clips">
      <header class="review-head">
        <div>
          <h1>Train</h1>
          <p class="section-lede" style="margin:0">
            Paste a YouTube URL (Orthodox reference) or a Pathé search, then tag Orthodox Jew / Not.
          </p>
          <p class="section-lede" style="margin:0.35rem 0 0" id="trainStats">—</p>
        </div>
        <div class="filters">
          <input id="trainQuery" type="search" placeholder="YouTube URL or Pathé search…" />
          <div class="chip-row" id="statusChips">
            <button class="chip active" data-status="pending">To tag</button>
            <button class="chip" data-status="">All</button>
            <button class="chip" data-status="yes">Orthodox</button>
            <button class="chip" data-status="no">Not</button>
          </div>
          <input id="search" type="search" placeholder="Filter titles…" />
          <button class="btn" id="loadBtn" type="button">Load Pathé search</button>
          <button class="btn ghost" id="scanBtn" type="button">Score these</button>
          <button class="btn ghost" id="clipBtn" type="button">Train CLIP (Keep/Pass deep)</button>
          <button class="btn ghost" id="clearBtn" type="button">Clear set</button>
        </div>
      </header>

      <p class="section-lede" id="trainStatus" style="margin:0 0 1rem"></p>

      <div class="board">
        <div class="list" id="list"></div>
        <aside class="detail" id="detail">
          <div class="sheet placeholder">Select a clip</div>
        </aside>
      </div>
    </div>

    <div class="tab-pane" data-tab="frames" hidden>
      <header class="review-head">
        <div>
          <h1>Probe frames</h1>
          <p class="section-lede" style="margin:0">
            Click a frame to toggle. <strong>Included Keep</strong> = good.
            <strong>Excluded</strong> (and included Pass) = wrong examples for training — nothing is ignored.
          </p>
          <p class="section-lede" style="margin:0.35rem 0 0" id="probeStats">—</p>
        </div>
      </header>

      <div class="probe-toolbar">
        <div class="chip-row" id="labelChips">
          <button type="button" class="chip active" data-label="all">All</button>
          <button type="button" class="chip" data-label="keep">Keep</button>
          <button type="button" class="chip" data-label="pass">Pass</button>
        </div>
        <div class="chip-row" id="probeStatusChips">
          <button type="button" class="chip active" data-status="all">All</button>
          <button type="button" class="chip" data-status="included">Included</button>
          <button type="button" class="chip" data-status="excluded">Excluded</button>
        </div>
        <div class="probe-actions">
          <button type="button" class="btn ghost small" id="probeIncludeAll">Include visible</button>
          <button type="button" class="btn ghost small" id="probeExcludeAll">Exclude visible</button>
          <button type="button" class="btn ok" id="probeTrain">Train CLIP with selection</button>
        </div>
      </div>

      <p class="crops-summary" id="probeStatus">Loading frames…</p>
      <div class="frame-grid" id="probeGrid"></div>
      <div class="probe-pager" id="probePager" hidden>
        <button type="button" class="btn ghost small" id="probePrev">Previous</button>
        <span id="probePageLabel"></span>
        <button type="button" class="btn ghost small" id="probeNext">Next</button>
      </div>
    </div>
  </div>

  <script src="/assets/common.js"></script>
  <script src="/assets/train.js"></script>
</body>
</html>
