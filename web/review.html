<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review — ShtetlFrames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,560&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="wrap">
    <nav id="siteNav"></nav>

    <div class="tabs" role="tablist">
      <button type="button" data-tab="review" class="active">Review</button>
      <button type="button" data-tab="crops">Crops</button>
    </div>

    <div class="tab-pane" data-tab="review">
      <header class="review-head">
        <div>
          <h1>Review</h1>
          <p class="section-lede" style="margin:0">
            Check each moment the scan found. Keep the good ones, pass on the rest.
          </p>
        </div>
        <div class="filters">
          <div class="chip-row" id="statusChips">
            <button class="chip active" data-status="">All</button>
            <button class="chip" data-status="pending">To check</button>
            <button class="chip" data-status="accept">Kept</button>
            <button class="chip" data-status="reject">Passed</button>
            <button class="chip" data-status="openai_keep">AI pass</button>
            <button class="chip" data-status="openai_drop">AI failed</button>
          </div>
          <input id="search" type="search" placeholder="Search titles…" />
          <select id="reviewSort" aria-label="Sort hits">
            <option value="scored:desc" selected>Scored · newest</option>
            <option value="scored:asc">Scored · oldest</option>
            <option value="score:desc">Score · high → low</option>
            <option value="score:asc">Score · low → high</option>
          </select>
          <button class="btn ghost small" id="backfillStillsBtn" type="button" title="Grab missing Review stills from Pathé">
            Backfill stills
          </button>
          <span class="review-backfill-status" id="backfillStillsStatus" aria-live="polite"></span>
        </div>
      </header>

      <div class="board">
        <div class="list" id="list"></div>
        <aside class="detail" id="detail">
          <div class="sheet placeholder">Select a candidate</div>
        </aside>
      </div>
    </div>

    <div class="tab-pane" data-tab="crops" hidden>
      <header class="review-head">
        <div>
          <h1>Crops</h1>
          <p class="section-lede" style="margin:0">
            Short labeled strips (±2s · 5 frames · every 1s · under 400KB). Queue them from Review, download here.
          </p>
        </div>
        <div class="filters">
          <button class="btn ghost small" id="refreshCrops" type="button">Refresh</button>
        </div>
      </header>

      <p class="crops-summary" id="cropsSummary">Loading…</p>
      <div class="crops-list" id="cropsList" style="padding-bottom:3rem"></div>
    </div>
  </div>

  <script src="/assets/common.js"></script>
  <script src="/assets/review.js"></script>
</body>
</html>
