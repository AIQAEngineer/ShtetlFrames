<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Probe frames — ShtetlFrames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,560&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css?v=14" />
</head>
<body>
  <div class="wrap">
    <nav class="site-nav">
      <div class="nav-left">
        <a class="brand-mark" href="/">Shtetl<span>Frames</span></a>
        <a class="nav-pathe" href="/pathe">British Pathé</a>
      </div>
      <div class="nav-links">
        <a href="/#scrape">Scrape</a>
        <a href="/review">Review</a>
        <a href="/crops">Crops</a>
        <a href="/mark">Mark</a>
        <a href="/clip">Clip</a>
        <a href="/train">Train</a>
        <a class="active" href="/probe">Probe</a>
        <a href="/health">Health</a>
      </div>
    </nav>

    <header class="review-head">
      <div>
        <h1>Probe frames</h1>
        <p class="section-lede" style="margin:0">
          Click a frame to toggle. <strong>Included Keep</strong> = good.
          <strong>Excluded</strong> (and included Pass) = wrong examples for training — nothing is ignored.
        </p>
        <p class="section-lede" style="margin:0.35rem 0 0" id="probeStats">—</p>
      </div>
    </header>

    <div class="probe-toolbar">
      <div class="chip-row" id="labelChips">
        <button type="button" class="chip active" data-label="all">All</button>
        <button type="button" class="chip" data-label="keep">Keep</button>
        <button type="button" class="chip" data-label="pass">Pass</button>
      </div>
      <div class="chip-row" id="statusChips">
        <button type="button" class="chip active" data-status="all">All</button>
        <button type="button" class="chip" data-status="included">Included</button>
        <button type="button" class="chip" data-status="excluded">Excluded</button>
      </div>
      <div class="probe-actions">
        <button type="button" class="btn ghost small" id="probeIncludeAll">Include visible</button>
        <button type="button" class="btn ghost small" id="probeExcludeAll">Exclude visible</button>
        <button type="button" class="btn ok" id="probeTrain">Train CLIP with selection</button>
      </div>
    </div>

    <p class="crops-summary" id="probeStatus">Loading frames…</p>
    <div class="probe-grid" id="probeGrid"></div>
    <div class="probe-pager" id="probePager" hidden>
      <button type="button" class="btn ghost small" id="probePrev">Previous</button>
      <span id="probePageLabel"></span>
      <button type="button" class="btn ghost small" id="probeNext">Next</button>
    </div>
  </div>

  <script src="/assets/probe.js?v=2"></script>
</body>
</html>
