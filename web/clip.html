<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clip â€” ShtetlFrames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,560&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css?v=13" />
</head>
<body>
  <div class="wrap">
    <nav class="site-nav">
      <div class="nav-left">
        <a class="brand-mark" href="/">Shtetl<span>Frames</span></a>
        <a class="nav-pathe" href="/pathe">British PathÃ©</a>
      </div>
      <div class="nav-links">
        <a href="/#scrape">Scrape</a>
        <a href="/review">Review</a>
        <a href="/crops">Crops</a>
        <a href="/mark">Mark</a>
        <a class="active" href="/clip">Clip</a>
        <a href="/probe">Probe</a>
        <a href="/health">Health</a>
      </div>
    </nav>

    <header class="review-head">
      <div>
        <h1>Clip</h1>
        <p class="section-lede" style="margin:0">
          Load a PathÃ© reel, set start and end, then cut and upload the clip to Google Drive.
        </p>
      </div>
    </header>

    <form class="mark-form" id="clipForm">
      <label class="mark-field">
        <span>British PathÃ© URL</span>
        <input
          id="clipUrl"
          type="url"
          required
          placeholder="https://www.britishpathe.com/asset/187521/"
          autocomplete="off"
        />
      </label>
      <button class="btn ok" id="clipLoad" type="submit">Load video</button>
    </form>

    <p class="crops-summary" id="clipStatus">Paste a PathÃ© asset URL to begin.</p>
    <p class="clip-drive" id="clipDriveStatus"></p>
    <div class="clip-drive-actions">
      <button type="button" class="btn ghost small" id="clipDriveAuth" hidden>Connect Google account</button>
    </div>

    <div class="clip-result" id="clipResult" hidden>
      <div class="clip-player-wrap">
        <video id="clipVideo" controls playsinline></video>
      </div>

      <form class="mark-form clip-times" id="clipTimes">
        <label class="mark-field mark-field-mark">
          <span>Start</span>
          <input id="clipStart" type="text" required inputmode="decimal" placeholder="0:00" autocomplete="off" />
        </label>
        <button type="button" class="btn ghost small" id="clipSetStart">Set from playhead</button>
        <label class="mark-field mark-field-mark">
          <span>End</span>
          <input id="clipEnd" type="text" required inputmode="decimal" placeholder="0:10" autocomplete="off" />
        </label>
        <button type="button" class="btn ghost small" id="clipSetEnd">Set from playhead</button>
        <label class="mark-field">
          <span>Drive filename (optional)</span>
          <input id="clipName" type="text" placeholder="pathe_187521_clip.mp4" autocomplete="off" />
        </label>
        <div class="clip-actions">
          <button type="button" class="btn ghost" id="clipPreview">Preview range</button>
          <button type="button" class="btn ghost" id="clipCut">Cut only</button>
          <button type="submit" class="btn ok" id="clipUpload">Cut &amp; upload to Drive</button>
        </div>
      </form>

      <p class="mark-meta" id="clipMeta"></p>
      <div class="clip-done" id="clipDone" hidden>
        <p class="mark-meta" id="clipDoneMeta"></p>
        <video id="clipOut" controls playsinline hidden></video>
      </div>
    </div>
  </div>

  <script src="/assets/clip.js?v=4"></script>
</body>
</html>
