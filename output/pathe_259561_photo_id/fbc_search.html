<html>

</head>
<body>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
	var hash = window.location.hash;
	if (hash.startsWith("#q=id:")) {
		var newId = hash.split(":")[1];
		if (newId) {
			window.location.href = "https://fbc.pionier.net.pl/id/" + newId;
		}
	}
});
    </script>
</body>
</html>
